name: Lab2 syscall grading
on:
  push:
    branches:
      - fix/lab2-seccomp-requirements
  pull_request:
    branches:
      - syscall
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf qemu-system-misc python-is-python3
      - name: Basic lab grading
        run: make grade
      - name: Seccomp extra grading
        run: make grade-extra
